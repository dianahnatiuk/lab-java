<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #fff;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            width: auto;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .btn-warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
            padding: 0.4rem 0.8rem;
            width: auto;
        }

        .btn-warning:hover {
            background: var(--warning);
            color: white;
        }

        .hotel-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .hotel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .hotel-info h3 {
            font-size: 1.1rem;
        }

        .hotel-info p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .token-box {
            grid-column: span 2;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1> Hotel Booking Manager</h1>
        <span class="badge">Spring Boot 3 + Keycloak</span>
    </header>

    <div class="grid">
        <!-- Блок зберігання JWT Токена -->
        <div class="card token-box">
            <h2> Авторизація (Bearer Token)</h2>
            <div class="form-group">
                <label for="jwtToken">Вставте JWT Bearer токен адміністратора з Keycloak:</label>
                <input type="text" id="jwtToken" placeholder="eyJhbGciOiJSUzI1NiIsInR5cCI6...">
            </div>
        </div>

        <!-- Додавання / Редагування готелю (Admin) -->
        <div class="card">
            <h2 id="formTitle"> Додати готель (ADMIN)</h2>
            <form id="hotelForm">
                <input type="hidden" id="hotelId">
                <div class="form-group">
                    <label>Назва готелю</label>
                    <input type="text" id="hotelName" required placeholder="Grand Hotel">
                </div>
                <div class="form-group">
                    <label>Місто / Локація</label>
                    <input type="text" id="hotelLocation" required placeholder="Київ">
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="submit" id="submitBtn">Зберегти готель</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" style="background: var(--border); display: none;">Скасувати</button>
                </div>
            </form>
        </div>

        <!-- Список готелів (Public/Admin) -->
        <div class="card" style="grid-column: span 2;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2> Список готелів</h2>
                <button onclick="loadHotels()" style="width: auto; padding: 0.5rem 1rem;">Оновити список</button>
            </div>
            <div class="hotel-list" id="hotelsContainer">
                <p style="color: var(--text-muted);">Завантаження готелів...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api';

    // Завантаження всіх готелів (Публічний ендпоінт)
    async function loadHotels() {
        try {
            const res = await fetch(`${API_BASE}/public/hotels`);
            const data = await res.json();
            const container = document.getElementById('hotelsContainer');

            if (!Array.isArray(data) || data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Готелів поки немає.</p>';
                return;
            }

            container.innerHTML = data.map(hotel => `
                <div class="hotel-item">
                    <div class="hotel-info">
                        <h3>${hotel.name || 'Без назви'}</h3>
                        <p> ${hotel.location || 'Локація не вказана'}</p>
                    </div>
                    <div class="actions">
                        <button class="btn-warning" onclick="prepareEdit(${hotel.id}, '${escapeHtml(hotel.name)}', '${escapeHtml(hotel.location)}')">Редагувати</button>
                        <button class="btn-danger" onclick="deleteHotel(${hotel.id})">Видалити</button>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
            document.getElementById('hotelsContainer').innerHTML = '<p style="color: var(--danger);">Помилка завантаження даних (перевірте чи запущено додаток)</p>';
        }
    }

    // Підготовка форми до редагування
    function prepareEdit(id, name, location) {
        document.getElementById('hotelId').value = id;
        document.getElementById('hotelName').value = name;
        document.getElementById('hotelLocation').value = location;
        document.getElementById('formTitle').innerText = '✏️ Редагувати готель (ADMIN)';
        document.getElementById('submitBtn').innerText = 'Оновити готель';
        document.getElementById('cancelBtn').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Скидання форми до режиму створення
    function resetForm() {
        document.getElementById('hotelId').value = '';
        document.getElementById('hotelForm').reset();
        document.getElementById('formTitle').innerText = '➕ Додати готель (ADMIN)';
        document.getElementById('submitBtn').innerText = 'Зберегти готель';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    // Обробка відправки форми (Create або Update)
    document.getElementById('hotelForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('jwtToken').value.trim();
        const id = document.getElementById('hotelId').value;

        const hotelData = {
            name: document.getElementById('hotelName').value,
            location: document.getElementById('hotelLocation').value
        };

        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;

        let url = `${API_BASE}/admin/hotels`;
        let method = 'POST';

        if (id) {
            url = `${API_BASE}/admin/hotels/${id}`;
            method = 'PUT';
        }

        const res = await fetch(url, {
            method: method,
            headers: headers,
            body: JSON.stringify(hotelData)
        });

        if (res.ok) {
            alert(id ? 'Готель успішно оновлено!' : 'Готель успішно додано!');
            resetForm();
            loadHotels();
        } else {
            alert('Помилка! Перевірте правильність токена або права доступу (401/403).');
        }
    });

    // Видалення готелю (Адмінський ендпоінт)
    async function deleteHotel(id) {
        if (!confirm('Ви впевнені, що хочете видалити цей готель?')) return;

        const token = document.getElementById('jwtToken').value.trim();
        const headers = {};
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`${API_BASE}/admin/hotels/${id}`, {
            method: 'DELETE',
            headers: headers
        });

        if (res.ok) {
            loadHotels();
        } else {
            alert('Не вдалося видалити готель (потрібен дійсний токен адміністратора).');
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Автоматичне завантаження при відкритті сторінки
    loadHotels();
</script>
</body>
</html>
